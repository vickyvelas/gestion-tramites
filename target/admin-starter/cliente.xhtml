<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Formulario de Cliente</title>
</h:head>
<h:body>
    <h:form id="clienteForm">
        <h:panelGrid columns="2" cellpadding="5">
            <h:outputLabel for="cuit" value="CUIT Cliente:" />
            <h:inputText id="cuit" value="#{clienteBean.cliente.cuitCliente}" required="true" />
            
            <h:outputLabel for="nombre" value="Nombre y Apellido:" />
            <h:inputText id="nombre" value="#{clienteBean.cliente.nombreApellidoCliente}" required="true" />
            
            <h:outputLabel for="direccion" value="Dirección:" />
            <h:inputText id="direccion" value="#{clienteBean.cliente.direccionCliente}" required="true" />
            
            <h:outputLabel for="email" value="Email:" />
            <h:inputText id="email" value="#{clienteBean.cliente.mailCliente}" required="true" />
            
            <h:outputLabel for="telefono" value="Teléfono:" />
            <h:inputText id="telefono" value="#{clienteBean.cliente.telefonoCliente}" required="true" />
            
            <h:commandButton value="Guardar" action="#{clienteBean.saveCliente}" />
            <h:commandButton value="Cancelar" action="index" />
        </h:panelGrid>
    </h:form>
</h:body>
</html>
