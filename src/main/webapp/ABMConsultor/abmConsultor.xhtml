<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:adm="http://github.com/adminfaces"
                template="#{layoutMB.template}">

    <ui:define name="metadata">
        <f:metadata>

        </f:metadata>
        <ui:param name="renderFormAsterisks" value="true"/>
    </ui:define>

    <ui:define name="title">
        Agregar Consultor
    </ui:define>

    <ui:define name="body">
        
        <h:form id="form" prependId="false">
        
            <p:panel styleClass="box-primary card">
                <!-- Campo de entrada para el legajo del consultor -->
                <div class="ui-g ui-fluid">
                    <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
                        <div class="ui-sm-12 ui-g-11">
                            <p:outputLabel for="legajoConsultor" value="Legajo del Consultor:" />
                        </div>
                        <div class="ui-sm-12 ui-g-11">
                            <p:inputText id="legajoConsultor" value="#{uiabmConsultor.legajoConsultor}" style="width: 150px;" disabled="#{!uiabmConsultor.insert}" />
                            
                            <p:message id="legajoConsultorMSG" for="legajoConsultor"/>
                        </div>
                    </div>

                    <!-- Campo de entrada para el nombre del consultor -->
                    <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
                        <div class="ui-sm-12 ui-g-11">
                            <p:outputLabel for="nombreApellidoConsultor" value="Nombre y Apellido del Consultor:" />
                        </div>
                        <div class="ui-sm-12 ui-g-11">
                            <p:inputText id="nombreApellidoConsultor" value="#{uiabmConsultor.nombreApellidoConsultor}" style="width: 150px;" disabled="#{!uiabmConsultor.insert}"/>
                            <p:message id="nombreApellidoConsultorMSG" for="nombreApellidoConsultor"/>
                        </div>
                    </div>

                    <!-- Campo de entrada para el número máximo de trámites -->
                    <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
                        <div class="ui-sm-12 ui-g-11">
                            <p:outputLabel for="consultorNroMaxTramite" value="Trámites Asigandos:" />
                        </div>
                        <div class="ui-sm-12 ui-g-11">
                            <p:inputText id="consultorNroMaxTramite" value="#{uiabmConsultor.consultorNroMaxTramite}" />
                            <p:message id="consultorNroMaxTramiteMSG" for="consultorNroMaxTramite"/>
                        </div>
                    </div>

                    <!-- Botón para agregar/modificar consultor -->
                    <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
                        <div class="ui-sm-12 ui-g-4">
                            <p:commandButton value="Agregar" action="#{uiabmConsultor.agregarConsultor()}" icon="fa fa-check" styleClass="btn-primary" />
                        </div>
                    </div>   

                </div>
            </p:panel>

        </h:form>

    </ui:define>

</ui:composition>
