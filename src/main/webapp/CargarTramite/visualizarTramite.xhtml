<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:adm="http://github.com/adminfaces"
                template="#{layoutMB.template}">

    <ui:define name="metadata">
        
        <h:outputStylesheet name="css/visualizarTramite.css" />
           
           
        <f:metadata>
            <f:viewParam name="nroTramite" value="#{uivisualizarTramite.nroTramite}" />
            <f:event listener="#{uivisualizarTramite.visualizarTramite}" type="preRenderView"/>
        </f:metadata>
        <ui:param name="renderFormAsterisks" value="true" />
    </ui:define>

    <ui:define name="title">
        <h1>Datos del Trámite</h1>
    </ui:define>

    <ui:define name="body">
        <h:form>
            <p:focus context="@form">
                <div class="box">
                    <p:spacer height="5"/>
<p:panel styleClass="box">

    <!-- Número de Trámite -->
    <h:panelGroup layout="block" styleClass="custom-field">
        <h:outputLabel value="Número de Trámite:" styleClass="custom-label" />
        <h:outputText value="#{uivisualizarTramite.grilla.nroTramite}" styleClass="custom-text" />
    </h:panelGroup>

    <p:separator class="separator" />

    <!-- Nombre del Tipo Trámite -->
    <h:panelGroup layout="block" styleClass="custom-field">
        <h:outputLabel value="Nombre del Tipo Trámite:" styleClass="custom-label" />
        <h:outputText value="#{uivisualizarTramite.grilla.nombreTipoTramite}" styleClass="custom-text" />
    </h:panelGroup>

    <p:separator class="separator" />

    <!-- Estado del Trámite -->
    <h:panelGroup layout="block" styleClass="custom-field">
        <h:outputLabel value="Estado del Trámite:" styleClass="custom-label" />
        <h:outputText value="#{uivisualizarTramite.grilla.nombreEstadoTramite}" styleClass="custom-text" />
    </h:panelGroup>

    <p:separator class="separator" />

    <!-- Cliente -->
    <h:panelGroup layout="block" styleClass="custom-field">
        <h:outputLabel value="Cliente:" styleClass="custom-label" />
        <h:outputText value="#{uivisualizarTramite.grilla.nombreCliente}" styleClass="custom-text" />
    </h:panelGroup>

    <p:separator class="separator" />

    <!-- CUIT del Cliente -->
    <h:panelGroup layout="block" styleClass="custom-field">
        <h:outputLabel value="CUIT del Cliente:" styleClass="custom-label" />
        <h:outputText value="#{uivisualizarTramite.grilla.cuitCliente}" styleClass="custom-text" />
    </h:panelGroup>

    <p:separator class="separator" />

    <!-- Dirección del Cliente -->
    <h:panelGroup layout="block" styleClass="custom-field">
        <h:outputLabel value="Dirección del Cliente:" styleClass="custom-label" />
        <h:outputText value="#{uivisualizarTramite.grilla.direccion}" styleClass="custom-text" />
    </h:panelGroup>

    <p:separator class="separator" />

    <!-- Precio del Trámite -->
    <h:panelGroup layout="block" styleClass="custom-field">
        <h:outputLabel value="Precio del Trámite:" styleClass="custom-label" />
        <h:outputText value="#{uivisualizarTramite.grilla.precioTramite}" styleClass="custom-text" />
    </h:panelGroup>

    <p:dataTable id="grid1" widgetVar="docuTable" 
                 value="#{uivisualizarTramite.grilla.documentacionesDTO}" var="documentacion"
                  styleClass="completarDocumentacion-table">
        <p:column>
            <f:facet name="header">Nombre Documentación</f:facet>
            #{documentacion.nombreDocumentacion}
        </p:column>
        <p:column>
            <f:facet name="header">Fecha de Entrega</f:facet>
            #{documentacion.fechaHoraEntrega}
        </p:column>
        <p:column>
            <p:commandButton title="Completar Documentación">
            </p:commandButton>
        </p:column>
    </p:dataTable>
</p:panel>

                </div>
            </p:focus>
        </h:form>
        
        <h:form>
            <div class="ui-sm-12 ui-g-4" style="text-align: left;">
                <p:commandButton value="Atras"  
                                 action="#{uicargarTramite.cancelar()}" 
                 process="@this"/>
            </div>
        </h:form>
        
    </ui:define>
</ui:composition>
