<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:adm="http://github.com/adminfaces"
                template="#{layoutMB.template}">

    <ui:define name="metadata">
        <f:metadata>

        </f:metadata>
        <ui:param name="renderFormAsterisks" value="true"/>
    </ui:define>
    
    <ui:define name="title">
        Cambiar Estado
    </ui:define>
    <ui:define name="body">
        
    <h:form id="form" prependId="false">
        
        <p:panel styleClass="box-primary card">
        
        <div class="ui-g ui-fluid">
    <!-- Campo de entrada para el código del estado -->
            <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
               <div class="ui-sm-12 ui-g-11">
                            <p:outputLabel for="codigo" value="Código del Estado:" />
               </div>
                 <div class="ui-sm-12 ui-g-11">
                     <p:inputText id="codigo" style="width: 150px;" >
                     </p:inputText><p:message id="codigoMSG" for="codigo"/>
                 </div>
            </div>   
            
    <!-- Campo de entrada filtro nombre estado-->
            <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
               <div class="ui-sm-12 ui-g-11">
                          <p:outputLabel for="nombre" value="Nombre del Estado:" />
            </div>
            <div class="ui-sm-12 ui-g-11"> 
                  <p:inputText id="nombre" />
             </div>
            </div>  
    
        <!-- Campo de entrada filtro nombre estado-->
            <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
               <div class="ui-sm-12 ui-g-11">
                          <p:outputLabel for="nombre" value="Tipo Tramite:" />
            </div>
            <div class="ui-sm-12 ui-g-11"> 
                  <p:inputText id="nombre" />
             </div>
            </div> 
            
    <!-- Botón para aplicar filtros -->
            <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
               <div class="ui-sm-12 ui-g-4">
                <p:commandButton value="Aplicar"  icon="fa fa-check"
                                   styleClass=" btn-primary" /> 
                </div>
            </div>   
       </div>
        </p:panel>
    </h:form>

    </ui:define>

    </ui:composition >
