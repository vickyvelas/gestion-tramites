<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:adm="http://github.com/adminfaces"
                template="#{layoutMB.template}">

    <ui:define name="metadata">
        <f:metadata>

        </f:metadata>
        <ui:param name="renderFormAsterisks" value="true"/>
    </ui:define>
    
    <ui:define name="title">
        Cambiar Estado
    </ui:define>
    <ui:define name="body">
        
        <h:form id="form" prependId="false" >
        <div class="card" align="center" >
           <p:dataViewGridItem>  
             <h:panelGrid id="tramiteDet" style="margin: 30px" cellpadding="30">
                 
            <h:outputText value="Estado actual:" />
            <h:outputText value="#{uiHistorico.nombreEstadoTramite}"/>
            
             </h:panelGrid>
           </p:dataViewGridItem>
            
            <h:outputText value="Seleccione próximo estado" />
            <!-- botones de posibles estados -->
            <p:selectOneRadio id="line"  layout="lineDirection">
                <f:selectItem itemLabel="Option1" itemValue="Option1"/>
                <f:selectItem itemLabel="Option2" itemValue="Option2"/>
                <f:selectItem itemLabel="Option3" itemValue="Option3"/>
            </p:selectOneRadio>
            <h:outputText value="Observaciones"/>
            <div>
                <p:inputTextarea rows="6" cols="90"/>
            </div>
            
            <!-- botones de GUARDAR Y CANCELAR -->
            <p:toolbar>
            <p:toolbarGroup align="right">
            <div class="box-header with-border" >
                <div id="main-buttons">
                    <p:commandButton value="Guardar Cambio"  styleClass="rounded-button btn-primary"/>
                 </div>
            </div>
            
            <div class="box-header with-border" >
                <div id="main-buttons" >
                    <p:commandButton value="Cancelar"  styleClass="rounded-button btn-primary" actionListener="#{uiHistorico.irEtapas()}"/>
                 </div>
            </div>
            </p:toolbarGroup>
             </p:toolbar>
        </div>
       
    </h:form>

    </ui:define>

    </ui:composition >
