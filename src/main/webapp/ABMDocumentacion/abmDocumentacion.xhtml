<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:adm="http://github.com/adminfaces"
                template="#{layoutMB.template}">

    <ui:define name="metadata">
        <f:metadata>
            <!-- Metadata necesaria -->
        </f:metadata>
        <ui:param name="renderFormAsterisks" value="true"/>
        <style type="text/css">
            .centered-column {
                text-align: center;
                vertical-align: middle;
                font-size: 18px; /* Aumenta el tamaño de la fuente en las celdas de la tabla */
            }
            .consultor-column {
                width: 300px;
                font-size: 18px; /* Aumenta el tamaño de la fuente para los consultores */
            }
            .small-column {
                width: 100px;
                font-size: 18px; /* Aumenta el tamaño de la fuente para las fechas */
            }
            .small-add-button, .small-delete-button {
                font-size: 14px;
                padding: 5px 10px; /* Ajusta el tamaño del botón */
                margin: auto;
                text-align: center;
                transition: background-color 0.3s ease, transform 0.7s ease;
            }
            .small-add-button {
                background-color: #00cc00 !important;
                color: white !important;
            }
            .small-add-button:hover {
                background-color: #009900 !important;
            }
            .small-delete-button {
                background-color: #ff3333 !important;
                color: white !important;
            }
            .small-delete-button:hover {
                background-color: darkred !important;
            }
            .input-margin {
                margin-right: 10px;
            }
            .search-container {
                display: flex;
                justify-content: flex-end;
                align-items: center;
                margin-right: 30px;
            }
            .search-button {
                min-width: 100px;
                margin-left: 20px; /* Añade espacio entre el botón de buscar y el campo Mes */
            }
            .header-container {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 20px;
            }
            .label-large {
                font-size: 24px; /* Aumenta el tamaño de la letra para los textos Año: y Mes: */
                font-weight: bold;
                margin-right: 10px; /* Espaciado entre el texto y el input */
            }
            .input-large {
                font-size: 20px; /* Aumenta el tamaño de los campos de entrada */
                padding: 5px;
                width: 120px; /* Aumenta el ancho de los inputs */
            }
            /* Nuevo estilo para el contenedor de tablas */
            .tables-container {
                display: flex; /* Usamos flexbox para colocar las tablas una al lado de la otra */
                justify-content: space-between; /* Espacio entre las tablas */
            }
            
        </style>
    </ui:define>

    <ui:define name="title">
        <!-- Título de la página -->
        Agregar/Modificar Documentación
    </ui:define>

    <ui:define name="body">
        <h:form id="form" prependId="false">
            <p:panel styleClass="box-primary card">
                <div class="ui-g ui-fluid">

                    <!-- Campo de entrada para el código de la documentación -->
                    <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
                        <div class="ui-sm-12 ui-g-11">
                            <p:outputLabel for="codDocumentacion" value="Código de la Documentación:" />
                        </div>
                        <div class="ui-sm-12 ui-g-11">
                            <p:inputText id="codDocumentacion" value="#{uiabmDocumentacion.codDocumentacion}" style="width: 150px;" disabled="#{!uiabmDocumentacion.insert}" />
                            <p:message id="codDocumentacionMSG" for="codDocumentacion"/>
                        </div>
                    </div>

                    <!-- Campo de entrada para el nombre de la documentación -->
                    <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
                        <div class="ui-sm-12 ui-g-11">
                            <p:outputLabel for="nombreDocumentacion" value="Nombre de la Documentación:" />
                        </div>
                        <div class="ui-sm-12 ui-g-11">
                            <p:inputText id="nombreDocumentacion" value="#{uiabmDocumentacion.nombreDocumentacion}" style="width: 150px;" />
                            <p:message id="nombreDocumentacionMSG" for="nombreDocumentacion"/>
                        </div>
                    </div>

                    <!-- Botón para agregar/modificar documentación -->
                    <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
                        <div class="ui-sm-12 ui-g-4">
                            <p:commandButton value="Guardar" action="#{uiabmDocumentacion.agregarModificarDocumentacion()}" icon="fa fa-check" styleClass="btn-primary" />
                        </div>
                    </div>   

                </div>
            </p:panel>
        </h:form>
    </ui:define>
</ui:composition>
