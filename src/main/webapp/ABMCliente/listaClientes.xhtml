<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:adm="http://github.com/adminfaces"
                template="#{layoutMB.template}">
    <ui:define name="metadata">
        <ui:param name="title" value="Lista de Clientes"/> <!-- Automatic create breadCrumb and page title when param 'title' is provided. --> 
        
   <style type="text/css">
            .ui-datatable .ui-datatable-header {
                text-align: right !important;
            }
        </style>
    </ui:define>

    <ui:define name="description">
        Lista de Clientes
    </ui:define>

    <ui:define name="body">
    <h:form>
        <p:focus context="@form"/>
            <div class="box box-primary">
                        
                    
        <!-- Tabla para mostrar la lista de Clientes -->
         <p:separator/>

                   <div class="ui-g ui-fluid">
 
                       <p:dataTable id="grid1" widgetVar="ListaClientesTable" value="#{uiListaClientes.obtenerListaCliente()}" var="listaClientes" >

            <p:column>
                <f:facet name="header">CUIT</f:facet>
              #{listaClientes.cuitCliente}
            </p:column>

            <p:column>
                <f:facet name="header">Apellido y Nombre</f:facet>
                #{listaClientes.nombreApellidoCliente}
            </p:column>

            <p:column>
                <f:facet name="header">Fecha Baja</f:facet>
                #{listaClientes.fechaHoraBajaCliente}
            </p:column>


            <p:column>
                <f:facet name="header">Cuit</f:facet>
               #{tramiteConsultor.cuitCliente}
            </p:column>
                
               
                <p:column> 
                   
                      <p:commandButton icon="pi pi-search" styleClass="btn-info" action="#{uiListaClientes.irACliente(listaClientes.cuitCliente)}">
                    <f:ajax render="@form"/>
                     </p:commandButton>
                </p:column>
                    
    

        </p:dataTable>
            </div>
            </div>

   </h:form>

 </ui:define>
    </ui:composition>
