<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:adm="http://github.com/adminfaces"
                template="#{layoutMB.template}">

    <ui:define name="metadata">
        <f:metadata>

        </f:metadata>
        <ui:param name="renderFormAsterisks" value="true"/>
    </ui:define>
    <ui:define name="title">
        Importar Lista de Precio
    </ui:define>
    <ui:define name="body">

        <h:form id="form" prependId="false">

            <p:panel styleClass="box-primary card">
                <!-- Campo de entrada para el codListaPrecio -->
                <div class="ui-g ui-fluid">
                    <p:outputLabel  value="Codigo Lista de Precio:" />
                    <p:inputText  value="222" style="width: 150px;" /> 
                    <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
                        <div class="ui-sm-12 ui-g-11">
                            <p:outputLabel for="fechaDesde" value="Fecha Desde" />
                        </div>
                        <div class="ui-sm-12 ui-g-11">
                            <p:inputText id="fechaDesde"  style="width: 150px;"  >

                            </p:inputText><p:message id="fechaDesdeMSG" for="fechaDesde"/>
                        </div>
                    </div>  

                    <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
                        <div class="ui-sm-12 ui-g-11">
                            <p:outputLabel for="fechaHasta" value="Fecha Hasta" />
                        </div>
                        <div class="ui-sm-12 ui-g-11">
                            <p:inputText id="fechaHasta" style="width: 150px;"  >

                            </p:inputText><p:message id="fechaHastaMSG" for="fechaHasta"/>
                        </div>
                    </div>
                    <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
                        <div class="card">
                            <h:form id="frmSingle">
                                <p:fileUpload id="upload" value="#{fileUploadView.file}"
                                              mode="simple" skinSimple="true" auto="true"
                                              process="@this" update="messages"
                                              listener="#{fileUploadView.handleFileUpload}" />
                            </h:form>
                        </div>
                    </div>

                    <!-- BOTONES -->

                    <div class="box-header with-border">                    
                        <div id="main-buttons">
                            <p:commandButton value="Subir"    styleClass="btn-primary"/>
                        </div>                    
                    </div>

                    <div class="box-header with-border">                    
                        <div id="main-buttons">
                            <p:commandButton value="Cancelar"    styleClass="btn-primary"/>
                        </div>                    
                    </div>

                </div>
            </p:panel>

        </h:form>

    </ui:define>

</ui:composition
