<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:adm="http://github.com/adminfaces"
                template="#{layoutMB.template}">
    <ui:define name="metadata">
        <ui:param name="title" value="Trabajar con Listas de Precio"/> <!-- Automatic create breadCrumb and page title when param 'title' is provided. --> 

        <style type="text/css">
            .ui-datatable .ui-datatable-header {
                text-align: right !important;
            }
        </style>
    </ui:define>

    <ui:define name="description">
        Trabajar con Listas de Precio
    </ui:define>

    <ui:define name="body">
        <adm:breadcrumb title="Upload"/>
        <script>
            PrimeFaces.locales['es'] = {
                monthNames: ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'],
                monthNamesShort: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'],
                dayNames: ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'],
                dayNamesShort: ['Dom', 'Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab'],
                dayNamesMin: ['D', 'L', 'M', 'X', 'J', 'V', 'S'],
                weekHeader: 'Semana',
                firstDay: 1,
                isRTL: false,
                showMonthAfterYear: false,
                yearSuffix: '',
                timeOnlyTitle: 'Sólo hora',
                timeText: 'Tiempo',
                hourText: 'Hora',
                minuteText: 'Minuto',
                secondText: 'Segundo',
                millisecondText: 'Milisegundo',
                ampm: false,
                month: 'Mes',
                week: 'Semana',
                day: 'Día',
                allDayText: 'Todo el día',
                today: 'Hoy',
                now: 'Ahora',
                clear: 'Limpiar',
                aria: {
                    close: 'Cerrar',
                    previous: 'Anterior',
                    next: 'Siguiente',
                }
            };
        </script>
        <h:form>
            <p:focus context="@form"/>
            <div class="box box-primary">

                <div class="box-header with-border">                    
                    <div id="main-buttons">
                        <p:commandButton value="Importar"  icon="fa fa-plus" action="#{uiActualizarListaPrecioMenu.irAgregarListaPrecio()}"   styleClass="btn-primary"/>
                    </div>                    
                </div>
                <!-- Tabla para mostrar la lista de precio -->
                <p:separator/>

                <div class="ui-g ui-fluid">
                    <div class="ui-g-12 ui-md-6">
                        <p:outputPanel>
                            <h:outputText value="Código:"/>
                            <p:spacer height="10"/>
                            <p:inputText id="codFilter"  style="width:150px"
                                         placeholder=""  onfocus="Javascript:this.focus();this.select();">
                                <p:ajax event="keyup" 
                                        listener="#{uiActualizarListaPrecioMenu.filtrar()}" 
                                        update="@form:grid1"
                                        />

                            </p:inputText>

                        </p:outputPanel> </div>

                    <div class="ui-g-12 ui-md-6">
                        <p:outputPanel>
                            <p:spacer height="10"/>                            
                            <div class="field col-12 md:col-4">
                                <p:outputLabel for="time" value="Fecha" />
                                <p:datePicker id="time" value="#{uiExcelFile.fechaDesde}" showTime="true" />
                            </div>
                        </p:outputPanel> 
                    </div>
                </div>
                <p:spacer height="5"/>
                <p:dataTable id="grid1" widgetVar="listaPrecioTable" value="#{uiActualizarListaPrecioMenu.buscarListaPrecio()}" var="listaPrecio" >

                    <p:column>
                        <f:facet name="header">Código</f:facet>
                            #{ListaPrecio.codListaPrecio}
                    </p:column>

                    <p:column>
                        <f:facet name="header">Fecha Desde</f:facet>
                            #{ListaPrecio.fechaDesdeListaPrecio}
                    </p:column>

                    <p:column>
                        <f:facet name="header">Fecha Hasta</f:facet>
                            #{ListaPrecio.fechaHastaListaPrecio}
                    </p:column>


                    <p:column>
                        <f:facet name="header">Fecha Baja</f:facet>
                            #{ListaPrecio.fechaBajaListaPrecio}
                    </p:column>

                    <p:column>
                        <f:facet name="header">Acciones</f:facet>
                        <p:commandButton value="Modificar" styleClass="btn-info" action="#{uiActualizarListaPrecioMenu.irModificarListaPrecio(ListaPrecio.codListaPrecio)}" disabled="#{ListaPrecio.fechaHoraBajaListaPrecio != null}">
                            <f:ajax render="@form"/>
                        </p:commandButton>
                        <p:spacer width="5"/>
                        <p:commandButton value="Eliminar" styleClass="btn-danger"  actionListener="#{uiActualizarListaPrecioMenu.darDeBajaListaPrecio(ListaPrecio.codListaPrecio)}" disabled="#{ListaPrecio.fechaHoraBajaListaPrecio != null}" update="@form:grid1">

                            <p:confirm header="Anulación de #{ListaPrecio.codListaPrecio} #{ListaPrecio.fechaHoraDesdeListaPrecio} #{ListaPrecio.fechaHoraHastaListaPrecio}" message="¿Está seguro?" icon="ui-icon-alert"/>

                        </p:commandButton>

                        <p:confirmDialog global="true"  showEffect="fade" hideEffect="fade" styleClass="box-solid box-danger">
                            <p:commandButton value="Si" type="button" styleClass="btn-material btn-primary ui-confirmdialog-yes"
                                             icon="fa fa-check" update="@form:grid1"/>
                            <p:commandButton value="No" type="button" styleClass="btn-material btn-danger ui-confirmdialog-no"
                                             icon="fa fa-close" update="@form:grid1"/>
                        </p:confirmDialog>
                    </p:column>

                </p:dataTable>
            </div>

        </h:form>

    </ui:define>
</ui:composition>
