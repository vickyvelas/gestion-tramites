<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:adm="http://github.com/adminfaces"
                template="#{layoutMB.template}">

    <ui:define name="metadata">
        <f:metadata>

        </f:metadata>
        <ui:param name="renderFormAsterisks" value="true"/>
    </ui:define>
    <ui:define name="title">
        Agregar Estado
    </ui:define>
    <ui:define name="body">
<style>
    .label {
        width: 20%;
        padding: 4px;
    }

    .value {
        width: 80%;
        padding: 4px;
    }

    .grid {
        width: 100%;
    }

    .error {
        color: red;
    }

    .outputLabel {
        font-weight: bold;
    }

    .grid {
        width: 33%;
        padding: 4px;
    }
</style>

<div class="card">
    <h:form>

        <p:growl id="growl" sticky="true" showDetail="true"/>

        <p:wizard flowListener="#{uiSolicitarTramiteWeb.onFlowProcess}">
            <p:tab id="nuevoTramite" title="Nuevo Tramite">
                <p:panel header="Nuevo Tramite">
                   
                     <p:panelGrid columns="2" columnClasses="ui-grid-col-2,ui-grid-col-4"
                                         layout="grid" styleClass="ui-fluid">
                        <p:outputLabel value="Ingresá tu número de CUIT" for="cuit"/>
                        <p:inputText id="cuit" value="#{uiSolicitarTramiteWeb.cuitCliente}"
                                             requiredMessage="El CUIT es requerido."
                                             required="true" label="CUIT"/>

                    </p:panelGrid>
                </p:panel>
            </p:tab>

            <p:tab id="datosCliente" title="Confirme sus Datos">
                <p:panel header="Confirme Sus Datose">
                   
                     <p:panelGrid columns="2" columnClasses="ui-grid-col-2,ui-grid-col-4"
                                         layout="grid" styleClass="ui-fluid">
                        <p:outputLabel value="Nombre" for="nombre"/>
                        <h:outputText id="nombre" value="#{uiSolicitarTramiteWeb.nombreApellidoCliente}"
                                            />

                    </p:panelGrid>
                </p:panel>
            </p:tab>

            <p:tab id="contact" title="Contact">
                <p:panel header="Contact Information">
                    <p:messages/>
                    <h:panelGrid columns="2" columnClasses="label, value">
                        <h:outputText value="Email: *"/>
                        <p:inputText value="#{userWizard.user.email}" required="true" label="Email"/>

                        <h:outputText value="Phone: "/>
                        <p:inputText value="#{userWizard.user.phone}"/>

                        <h:outputText value="Additional Info: "/>
                        <p:inputText value="#{userWizard.user.info}"/>
                    </h:panelGrid>
                </p:panel>
            </p:tab>

            <p:tab id="confirm" title="Confirmation">
                <p:panel header="Confirmation">
                    <h:panelGrid id="confirmation" columns="3" columnClasses="grid,grid,grid">
                        <h:panelGrid columns="2" columnClasses="label, value">
                            <h:outputText value="Firstname: "/>
                            <h:outputText value="#{userWizard.user.firstname}" styleClass="outputLabel"/>

                            <h:outputText value="Lastname: "/>
                            <h:outputText value="#{userWizard.user.lastname}" styleClass="outputLabel"/>

                            <h:outputText value="Age: "/>
                            <h:outputText value="#{userWizard.user.age}" styleClass="outputLabel"/>
                        </h:panelGrid>

                        <h:panelGrid columns="2" columnClasses="label, value">
                            <h:outputText value="Street: "/>
                            <h:outputText value="#{userWizard.user.street}" styleClass="outputLabel"/>

                            <h:outputText value="Postal: "/>
                            <h:outputText value="#{userWizard.user.postalCode}" styleClass="outputLabel"/>

                            <h:outputText value="City: "/>
                            <h:outputText value="#{userWizard.user.city}" styleClass="outputLabel"/>
                        </h:panelGrid>

                        <h:panelGrid columns="2" columnClasses="label, value">
                            <h:outputText value="Email: "/>
                            <h:outputText value="#{userWizard.user.email}" styleClass="outputLabel"/>

                            <h:outputText value="Phone "/>
                            <h:outputText value="#{userWizard.user.phone}" styleClass="outputLabel"/>

                            <h:outputText value="Info: "/>
                            <h:outputText value="#{userWizard.user.info}" styleClass="outputLabel"/>

                            <h:outputText/>
                            <h:outputText/>
                        </h:panelGrid>
                    </h:panelGrid>

                    <p:commandButton value="Submit" action="#{userWizard.save}" update="growl" process="@this"/>
                </p:panel>
            </p:tab>
        </p:wizard>

    </h:form>
</div>
            </ui:define>

    </ui:composition >
