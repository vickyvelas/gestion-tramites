<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core" xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:adm="http://github.com/adminfaces"
                template="#{layoutMB.template}">

    <ui:define name="metadata">
        <f:metadata>

        </f:metadata>
        <ui:param name="renderFormAsterisks" value="true"/>
    </ui:define>
    <ui:define name="title">
        Nuevo Tramite
    </ui:define>
    <ui:define name="body">
<style>
    .label {
        width: 20%;
        padding: 4px;
    }

    .value {
        width: 80%;
        padding: 4px;
    }

    .grid {
        width: 100%;
    }

    .error {
        color: red;
    }

    .outputLabel {
        font-weight: bold;
    }

    .grid {
        width: 33%;
        padding: 4px;
    }
    
    
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    }


    .container {
    background-color: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    width: 400px;
    text-align: center;
    border: 2px solid #0094ff;
    }

    h1 {
        margin-bottom: 20px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        margin-bottom: 20px;
    }

    .card {
        background-color: #f9f9f9;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    .card img {
        width: 50px;
        margin-bottom: 10px;
    }
</style>

<div class="card">
    <h:form>

        <p:growl id="growl" sticky="true" showDetail="true"/>

        <p:wizard flowListener="#{uiSolicitarTramiteWeb.onFlowProcess}">
            <p:tab id="validaciondeid" title="Validacion de Identidad">
                <p:panel header="Validacion de Identidad">
                   
                     <p:panelGrid columns="2" columnClasses="ui-grid-col-2,ui-grid-col-4"
                                         layout="grid" styleClass="ui-fluid">
                        <p:outputLabel value="Ingresá tu número de CUIT" for="cuit"/>
                        <p:inputText id="cuit" value="#{uiSolicitarTramiteWeb.cuitCliente}"
                                             requiredMessage="El CUIT es requerido."
                                             required="true" label="CUIT"/>

                    </p:panelGrid>
                </p:panel>
            </p:tab>

            <p:tab id="datosCliente" title="Confirme sus Datos">
                <p:panel header="Confirme Sus Datos">
                   
                     <p:panelGrid columns="2" columnClasses="ui-grid-col-2,ui-grid-col-4"
                                         layout="grid" styleClass="ui-fluid">
                        <p:outputLabel value="Nombre" for="nombre"/>
                        <h:outputText id="nombre" value="#{uiSolicitarTramiteWeb.nombreApellidoCliente}" />
                        <p:outputLabel value="Direccion" for="direccion"/>
                        <h:outputText id="direccion" value="#{uiSolicitarTramiteWeb.direccionCliente}"/>
                        <p:outputLabel value="Mail" for="mail"/>        
                        <h:outputText id="mail" value="#{uiSolicitarTramiteWeb.mailCliente}"
                                     
                                            />

                    </p:panelGrid>
                </p:panel>
            </p:tab>

            <p:tab id="categ" title="Seleccion de Categoria">
                <p:panel header="Seleccionar Categoria">
                    <p:dataView var="categoria" value="#{uiSolicitarTramiteWeb.obtenerCategorias()}"                       
                                            layout="grid" paginatorAlwaysVisible="false"
                       >
                        <p:dataViewGridItem>
  
                            
                            <p:panel header="#{categoria.nombre}"  styleClass="card">
                                <h:panelGrid columns="2" cellpadding="10">
                                   
                                    <h:outputText
                                        value="#{categoria.codigo}"/>
                                </h:panelGrid>
                            </p:panel>  
                        </p:dataViewGridItem>    
                    </p:dataView>
                </p:panel>
            </p:tab>

            
            
            <p:tab id="tramite" title="Seleccionar Tipo de Tramite">
                <p:panel header="Seleccionar Tipo de Tramite">
           
                    <div class="container">
      
        <div class="grid">
            <div class="card">
                <img src="../images/licencia.png" alt="Renovacion de Licencia" style="width:300px; height:100px;"/>
                <p>Renovacion de Licencia</p>
            </div>
            <div class="card">
                <img src="icon2.png" alt="Renovación de Carnet"/>
                <p>Renovacion de Carnet</p>
            </div>
            <div class="card">
                <img src="icon3.png" alt="Renovacion de DNI"/>
                <p>Renovacion de DNI</p>
            </div>
            <div class="card">
                <img src="icon1.png" alt="Renovacion de Pasaporte"/>
                <p>Renovacion de Pasaporte</p>
            </div>
        </div>
        
    </div>
                </p:panel>
            </p:tab>
            
            
            
            
            
            
            <p:tab id="docum" title="Documentacion">
                <p:panel header="Documentacion a presentar">
                    <h:panelGrid id="confirmation" columns="3" columnClasses="grid,grid,grid">
                        <h:panelGrid columns="2" columnClasses="label, value">
                            <h:outputText value="Firstname: "/>
                            <h:outputText value="#{userWizard.user.firstname}" styleClass="outputLabel"/>

                            <h:outputText value="Lastname: "/>
                            <h:outputText value="#{userWizard.user.lastname}" styleClass="outputLabel"/>

                            <h:outputText value="Age: "/>
                            <h:outputText value="#{userWizard.user.age}" styleClass="outputLabel"/>
                        </h:panelGrid>

                        <h:panelGrid columns="2" columnClasses="label, value">
                            <h:outputText value="Street: "/>
                            <h:outputText value="#{userWizard.user.street}" styleClass="outputLabel"/>

                            <h:outputText value="Postal: "/>
                            <h:outputText value="#{userWizard.user.postalCode}" styleClass="outputLabel"/>

                            <h:outputText value="City: "/>
                            <h:outputText value="#{userWizard.user.city}" styleClass="outputLabel"/>
                        </h:panelGrid>

                        <h:panelGrid columns="2" columnClasses="label, value">
                            <h:outputText value="Email: "/>
                            <h:outputText value="#{userWizard.user.email}" styleClass="outputLabel"/>

                            <h:outputText value="Phone "/>
                            <h:outputText value="#{userWizard.user.phone}" styleClass="outputLabel"/>

                            <h:outputText value="Info: "/>
                            <h:outputText value="#{userWizard.user.info}" styleClass="outputLabel"/>

                            <h:outputText/>
                            <h:outputText/>
                        </h:panelGrid>
                    </h:panelGrid>

                    <p:commandButton value="Submit" action="#{userWizard.save}" update="growl" process="@this"/>
                </p:panel>
            </p:tab>
        </p:wizard>
        <script>
  
        a=$(".ui-dataview-header");a.css('visibility', 'hidden');a.css('height', '0');

</script>
    </h:form>
</div>
            </ui:define>

    </ui:composition >
