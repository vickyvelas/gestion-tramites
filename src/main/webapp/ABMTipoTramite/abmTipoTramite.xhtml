<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:adm="http://github.com/adminfaces"
                template="#{layoutMB.template}">

    <ui:define name="metadata">
        <f:metadata>
            <!-- Metadatos adicionales, si es necesario -->
        </f:metadata>
        <ui:param name="renderFormAsterisks" value="true"/>
    </ui:define>
    
    <ui:define name="title">
        Agregar Tipo de Trámite
    </ui:define>
    
    <ui:define name="body">
        
        <h:form id="form" prependId="false">
        
            <p:panel styleClass="box-primary card">
                <!-- Campo de entrada para el código del Tipo de Trámite -->
                <div class="ui-g ui-fluid">
                    
                    <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
                        <div class="ui-sm-12 ui-g-11">
                            <p:outputLabel for="codTipoTramite" value="Código del Tipo de Trámite:" />
                        </div>
                        <div class="ui-sm-12 ui-g-11">
                            <p:inputText id="codTipoTramite" value="#{uiabmTipoTramite.codTipoTramite}" 
                                         style="width: 150px;" disabled="#{!uiabmTipoTramite.insert}">
                            </p:inputText>
                            <p:message id="codTipoTramiteMSG" for="codTipoTramite"/>
                        </div>
                    </div>

                    <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
                        <div class="ui-sm-12 ui-g-11">
                            <p:outputLabel for="nombreTipoTramite" value="Nombre del Tipo de Trámite:" />
                        </div>
                        <div class="ui-sm-12 ui-g-11"> 
                            <p:inputText id="nombreTipoTramite" value="#{uiabmTipoTramite.nombreTipoTramite}" />
                        </div>
                    </div>   

                    <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
                        <div class="ui-sm-12 ui-g-11">
                            <p:outputLabel for="descripcionTipoTramite" value="Descripción:" />
                        </div>
                        <div class="ui-sm-12 ui-g-11"> 
                            <p:inputTextarea id="descripcionTipoTramite" value="#{uiabmTipoTramite.descripcionTipoTramite}" 
                                             rows="3" cols="20"/>
                        </div>
                    </div>

                    <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
                        <div class="ui-sm-12 ui-g-11">
                            <p:outputLabel for="descripcionTipoTramiteWeb" value="Descripción (Web):" />
                        </div>
                        <div class="ui-sm-12 ui-g-11"> 
                            <p:inputTextarea id="descripcionTipoTramiteWeb" value="#{uiabmTipoTramite.descripcionTipoTramiteWeb}" 
                                             rows="3" cols="20"/>
                        </div>
                    </div>

                    <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
                        <div class="ui-sm-12 ui-g-11">
                            <p:outputLabel for="maxDiaEntrega" value="Máximo Días de Entrega:" />
                        </div>
                        <div class="ui-sm-12 ui-g-11"> 
                            <p:inputText id="maxDiaEntrega" value="#{uiabmTipoTramite.maxDiaEntrega}" 
                                         style="width: 100px;" />
                        </div>
                    </div>

                    <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
                        <div class="ui-sm-12 ui-g-11">
                            <p:outputLabel for="categoriaTramite" value="Categoría del Trámite:" />
                        </div>
                        <div class="ui-sm-12 ui-g-11"> 
                            <p:inputText id="categoriaTramite" value="#{uiabmTipoTramite.categoriaTramite}" />
                        </div>
                    </div>

                    <div class="ui-sm-12 ui-g-6 ui-g-nopad"> 
                        <div class="ui-sm-12 ui-g-4">
                            <!-- Botón para agregar el Tipo de Trámite -->
                            <p:commandButton value="Agregar" action="#{uiabmTipoTramite.agregarTipoTramite()}" 
                                             icon="fa fa-check" styleClass="btn-primary" />
                        </div>
                    </div>   
                </div>
            </p:panel>
        </h:form>

    </ui:define>
</ui:composition>
